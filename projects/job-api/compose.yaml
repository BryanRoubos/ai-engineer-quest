services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: quest
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: quest
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - quest_db:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quest -d quest"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  quest_db:
