name: Level 1 — Automated Python Lab Tests
on:
  push:
    branches: [main]
    paths:
      - "starter/**"
      - ".github/workflows/starter-tests.yml"
  pull_request:
    paths:
      - "starter/**"
      - ".github/workflows/starter-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: starter/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Verify starter health tests
        run: python -m pytest tests/test_smoke.py -q
      - name: Grade assignment endpoints
        run: python -m pytest tests/test_assignment.py -q
