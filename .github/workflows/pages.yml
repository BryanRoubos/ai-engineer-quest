name: Deploy static website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript and bootcamp rendering
        run: node scripts/smoke.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live GitHub Pages output
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Checking published site: $SITE_URL"
          for attempt in $(seq 1 18); do
            if curl -fsSL --max-time 15 "$SITE_URL" | grep -Fq 'guided-builds.js?v=20261018-10' &&
               curl -fsSL --max-time 15 "${SITE_URL%/}/guided-builds.js?v=20261018-10" | grep -Fq 'GUIDED_BUILDS'; then
              echo "Verified published HTML and guided build script."
              exit 0
            fi
            echo "Site not updated yet. Retry $attempt/18..."
            sleep 10
          done
          echo "::error::Published Pages content could not be verified."
          exit 1
